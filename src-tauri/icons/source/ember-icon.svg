<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Diagonal accent to accent-hover green, matching the in-app brand square
         (.rail-brand gradient 135deg from the accent to accent-hover token).
         userSpaceOnUse so the rect samples the same 0,0 to 180,180 diagonal. -->
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="180" y2="180">
      <stop offset="0" stop-color="#3fbf6f"/>
      <stop offset="1" stop-color="#4fce7e"/>
    </linearGradient>
  </defs>
  <!-- translate(92) + scale(4.6667): a 180-unit design square -> an 840px squircle centred on the
       1024 canvas with a ~92px transparent margin (native-looking macOS Dock icon). -->
  <g transform="translate(92,92) scale(4.6666667)">
    <rect x="0" y="0" width="180" height="180" rx="42" fill="url(#bg)"/>
    <!-- Flying-envelope brand mark ("mail, sent"): a tilted envelope trailing three motion lines,
         stroked in the accent-contrast ink. The same silhouette drives the in-app EmberMark glyph. -->
    <g fill="none" stroke="#0e160f" stroke-linecap="round" stroke-linejoin="round">
      <g stroke-width="8.5">
        <line x1="17" y1="70" x2="41" y2="70"/>
        <line x1="9" y1="92" x2="43" y2="92"/>
        <line x1="19" y1="114" x2="41" y2="114"/>
      </g>
      <g transform="translate(104,92) rotate(-14) scale(4.3) translate(-12,-12)" stroke-width="2.3">
        <rect x="2" y="4" width="20" height="16" rx="2.6"/>
        <path d="M2.6 7 L11 12.5 a1.9 1.9 0 0 0 2 0 L21.4 7"/>
      </g>
    </g>
  </g>
</svg>
